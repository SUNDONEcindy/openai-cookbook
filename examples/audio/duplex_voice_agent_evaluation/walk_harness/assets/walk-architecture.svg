<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1280" aria-labelledby="walk-title walk-description" role="img" viewBox="0 0 1320 1280"><title id="walk-title">WALK recorded single-turn voice-agent evaluation</title><desc id="walk-description">A saved caller recording enters one GPT Live voice agent containing its reasoning backend and tools. An optional separate text-to-speech and noise workflow can create the recording before evaluation. Agent context goes only to the agent. Private expected outcomes go only to grading and results.</desc><defs><marker id="arrow-orange" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="none" stroke="#c48a47" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M1.5 1.5 8 5 1.5 8.5"/></marker><marker id="arrow-blue" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="none" stroke="#7290bd" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M1.5 1.5 8 5 1.5 8.5"/></marker><marker id="arrow-blue-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="2" refY="5"><path fill="none" stroke="#7290bd" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M8 1.5 2 5 8 8.5"/></marker><marker id="arrow-green" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="none" stroke="#739b79" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M1.5 1.5 8 5 1.5 8.5"/></marker><filter id="soft-shadow" width="130%" height="185%" x="-15%" y="-35%"><feDropShadow dx="0" dy="5" flood-color="#182b38" flood-opacity=".045" stdDeviation="9"/></filter></defs><style>svg{background:#fff;font-family:&quot;OpenAI Sans&quot;,&quot;SF Pro Display&quot;,&quot;Inter&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.canvas{fill:#fff}.agent-boundary rect{fill:#f7f9fd;stroke:#d5deeb;stroke-width:1.4}.flow{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.flow--orange{stroke:#c48a47}.flow--optional{stroke:#c48a47;stroke-dasharray:5 7}.flow--blue,.flow--context,.flow--response{stroke:#7290bd}.flow--green{stroke:#739b79}.flow--expected{stroke:#739b79;stroke-dasharray:5 7}.card-surface{stroke-width:1.25;filter:url(#soft-shadow)}.card--orange .card-surface{fill:#fffbf6;stroke:#e9d7bd}.card--orange .icon-surface{fill:#fff1dc}.card--orange .node-icon{stroke:#a86d31}.card--optional .card-surface{fill:#fffdfa;stroke:#e5d5bd;stroke-dasharray:5 5}.card--assistant .card-surface{fill:#eef4fe;stroke:#b8cbed}.card--assistant .icon-surface{fill:#dae7fc}.card--assistant .node-icon{stroke:#37659d}.card--backend .card-surface{fill:#fff;stroke:#d1dceb}.card--backend .icon-surface{fill:#eef2f8}.card--backend .node-icon{stroke:#516983}.card--green .card-surface{fill:#f1f8f1;stroke:#c6ddc8}.card--green .icon-surface{fill:#e0f0e1}.card--green .node-icon{stroke:#4c7952}.node-icon{fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.node-title{fill:#202520;font-size:25px;font-weight:590;letter-spacing:-.52px}.card--assistant .node-title{font-size:27px}.card--optional .node-title{font-size:21px}.node-detail{fill:#676f70;font-family:&quot;SF Mono&quot;,&quot;SFMono-Regular&quot;,ui-monospace,monospace;font-size:15.6px;letter-spacing:-.24px}.edge-label rect{fill:#fff;stroke:#edf0ee;stroke-width:.9}.edge-label text{font-size:15px;font-weight:530;text-anchor:middle;letter-spacing:-.08px}.edge-label--orange text{fill:#8e6538}.edge-label--blue text{fill:#506b91}.edge-label--green text{fill:#537758}</style><rect width="1320" height="1280" class="canvas"/><g class="agent-boundary" data-node-id="assistant-boundary"><rect width="616" height="345" x="352" y="617" rx="29"/></g><g aria-hidden="true"><path marker-end="url(#arrow-orange)" d="M660 194 V454" class="flow flow--orange"/><path marker-end="url(#arrow-orange)" d="M405 168 H332 Q3