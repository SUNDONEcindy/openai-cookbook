<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1280" aria-labelledby="run-title run-description" role="img" viewBox="0 0 1320 1280"><title id="run-title">RUN continuous multi-turn voice-agent evaluation</title><desc id="run-description">A scenario gives its private goal, persona, and agenda to a GPT Live caller with independent managed Responses reasoning and no tools, and gives agent context to a separate GPT Live agent. Both Live frontends use Marble and continuously exchange audio. The caller backend uses Luna at low effort; only the evaluated agent owns application tools and state. An independent semantic completion observer receives evaluator-owned expected state and constraints and recognizes the end of the conversation. The full expected outcome remains evaluator-only.</desc><defs><marker id="arrow-orange" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="none" stroke="#c48a47" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M1.5 1.5 8 5 1.5 8.5"/></marker><marker id="arrow-orange-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="2" refY="5"><path fill="none" stroke="#c48a47" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M8 1.5 2 5 8 8.5"/></marker><marker id="arrow-blue" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="none" stroke="#7290bd" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M1.5 1.5 8 5 1.5 8.5"/></marker><marker id="arrow-blue-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="2" refY="5"><path fill="none" stroke="#7290bd" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M8 1.5 2 5 8 8.5"/></marker><marker id="arrow-green" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="none" stroke="#739b79" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M1.5 1.5 8 5 1.5 8.5"/></marker><filter id="soft-shadow" width="130%" height="185%" x="-15%" y="-35%"><feDropShadow dx="0" dy="5" flood-color="#182b38" flood-opacity=".045" stdDeviation="9"/></filter></defs><style>svg{background:#fff;font-family:&quot;OpenAI Sans&quot;,&quot;SF Pro Display&quot;,&quot;Inter&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.canvas{fill:#fff}.simulation-boundary rect{fill:#fcfcfb;stroke:#dfe3de;stroke-width:1.4}.simulation-caption{fill:#747b76;font-size:13px;font-weight:560;letter-spacing:.34px}.agent-boundary rect{fill:#f7f9fd;stroke:#d5deeb;stroke-width:1.4}.flow{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.flow--orange{stroke:#c48a47}.flow--blue{stroke:#7290bd}.flow--green{stroke:#739b79}.flow--expected{stroke:#739b79;stroke-dasharray:5 7}.card-surface{stroke-width:1.25;filter:url(#soft-shadow)}.card--orange .card-surface{fill:#fffbf6;stroke:#e9d7bd}.card--orange .icon-surface{fill:#fff1dc}.card--orange .node-icon{stroke:#a86d31}.card--assistant .card-surface{fill:#eef4fe;stroke:#b8cbed}.card--assistant .icon-surface{fill:#dae7fc}.card--assistant .node-icon{stroke:#37659d}.card--backend .card-surface{fill:#fff;stroke:#d1dceb}.card--backend .icon-surface{fill:#eef2f8}.card--backend .node-icon{stroke:#516983}.card--green .card-surface{fill:#f1f8f1;stroke:#c6ddc8}.card--green .icon-surface{fill:#e0f0e1}.card--green .node-icon{stroke:#4c7952}.node-icon{fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.node-title{fill:#202520;font-size:25px;font-weight:590;letter-spacing:-.52px}.card--assistant .node-title{font-size:27px}.card--observer .node-title{font-size:22px}.node-detail{fill:#676f70;font-family:&quot;SF Mono&quot;,&quot;SFMono-Regular&quot;,ui-monospace,monospace;font-size:15.6px;letter-spacing:-.24px}.edge-label rect{fill:#fff;stroke:#edf0ee;stroke-width:.9}.edge-label text{font-size:15px;fon